name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Deploy auth is RAILWAY_TOKEN (a repo secret), not GITHUB_TOKEN -- this
# workflow never touches the GitHub API beyond checking out code.
permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency: railway-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy exactly the commit CI validated, not whatever main moved to
          ref: ${{ github.event.workflow_run.head_sha }}
      # pinned (unlike the version-agnostic tools elsewhere in this repo,
      # e.g. tectonic/ruff) -- this is the one workflow that ships to
      # production, and an unpinned install can silently change `railway
      # up`'s behavior/flags on a future CLI release with no diff to review
      - run: npm i -g @railway/cli@5.41.2
      # service is named "Emend" in the Railway project, not "api"
      - run: railway up --service Emend --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

# The web app deploys via Vercel's native GitHub integration (root directory:
# web/) — no workflow needed here. See infra/runbook.md.
