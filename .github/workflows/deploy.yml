name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency: railway-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy exactly the commit CI validated, not whatever main moved to
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: npm i -g @railway/cli
      # service name must match the api service in the Railway project
      - run: railway up --service api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

# The web app deploys via Vercel's native GitHub integration (root directory:
# web/) — no workflow needed here. See infra/runbook.md.
