name: CI

on:
  pull_request:
  push:
    branches: [main]

# No job here needs more than reading the checked-out code -- least
# privilege for GITHUB_TOKEN rather than the repo's default (potentially
# broader) scope.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: ruff (existing python dirs)
        run: |
          dirs=""
          for d in core api latex; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          uvx ruff@0.15.22 check $dirs

  test-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A fixed, cacheable path -- Tectonic otherwise resolves its own
      # per-OS default (e.g. ~/.cache/Tectonic), which works fine but isn't
      # a stable key for actions/cache below.
      TECTONIC_CACHE_DIR: ${{ github.workspace }}/.tectonic-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Tectonic
        run: |
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tectonic
          tectonic --version
      # Every latex test compiles for real; with no cache each run re-fetches
      # the full package bundle from Tectonic's public relay, which rate
      # -limits under shared GitHub-runner IP traffic (seen twice in one day:
      # 429 Too Many Requests). Caching it here means only a cold cache ever
      # touches that network path.
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ${{ env.TECTONIC_CACHE_DIR }}
          key: tectonic-bundle-v33-0.16.9
      - name: Run latex tests
        run: |
          uv venv --python 3.12
          uv pip install jinja2 pydantic pytest
          .venv/bin/python -m pytest latex/tests -q

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run core tests (if present)
        run: |
          if [ -d core/tests ]; then
            uv venv --python 3.12
            if [ -f core/requirements.txt ]; then
              uv pip install -r core/requirements.txt pytest
            else
              uv pip install pydantic pytest
            fi
            .venv/bin/python -m pytest core/tests -q
          else
            echo "core/tests not present yet — skipping"
          fi

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run api tests (if present)
        run: |
          if [ -d api/tests ]; then
            uv venv --python 3.12
            # api now calls core.extract/core.jd_text (PDF upload, job-URL
            # ingestion) -- their deps live in core/requirements.txt, same
            # as the real Docker image installs both files together. The
            # preview/finalize endpoints also call latex.render directly, so
            # jinja2 (latex's only extra dep, installed inline in the
            # Dockerfile since there's no latex/requirements.txt) comes too.
            uv pip install -r api/requirements.txt -r core/requirements.txt jinja2 pytest
            .venv/bin/python -m pytest api/tests -q
          else
            echo "api/tests not present yet — skipping"
          fi

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web (if present)
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run lint && npm run build
          else
            echo "web/ not present yet — skipping"
          fi

  docker-latex-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The plain `docker build` CLI this replaced re-ran the image's
      # network-fetching RUN steps (warm-tectonic-cache.py) from scratch on
      # every CI run -- the GHA cache backend here reuses that layer across
      # runs instead, since the underlying relay rate-limits under shared
      # GitHub-runner traffic (seen twice in one day: 429 Too Many Requests).
      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: latex-sandbox
          tags: emend-latex-sandbox
          load: true
          cache-from: type=gha,scope=latex-sandbox
          cache-to: type=gha,mode=max,scope=latex-sandbox
      - name: Verify offline compile inside the sandbox
        run: |
          docker run --rm --network=none emend-latex-sandbox \
            python infra/scripts/warm-tectonic-cache.py

  docker-api-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same scope as docker-latex-sandbox's cache -- this build starts from
      # that same latex-sandbox stage, so a warm cache here skips its network
      # fetch too instead of paying for it a second time in the same run.
      - name: Build full api image (if api/ present)
        if: hashFiles('api/**') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          tags: emend-api
          cache-from: type=gha,scope=latex-sandbox
          cache-to: type=gha,mode=max,scope=full-api
