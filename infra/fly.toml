# Fly.io config for the api service. Deploy from the repo root:
#   fly deploy --config infra/fly.toml
# Replace the app name after `fly apps create`.

app = "emend-api"
primary_region = "sjc"

[build]
  dockerfile = "docker/api.Dockerfile"

[deploy]
  release_command = "alembic -c api/alembic.ini upgrade head"

[env]
  ARTIFACTS_DIR = "/data/artifacts"
  # First deploy runs mock mode; flip to "0" once the eval suite passes with a key.
  MOCK = "1"
  # Vercel (web) and Fly (api) are cross-site: the session cookie needs these.
  SESSION_COOKIE_SAMESITE = "none"
  SESSION_COOKIE_SECURE = "1"
  # Set to the deployed web origin(s), comma-separated, at Vercel setup time.
  CORS_ORIGINS = "http://localhost:3000"
  # DATABASE_URL and ANTHROPIC_API_KEY are secrets: `fly secrets set ...`

[[mounts]]
  source = "emend_artifacts"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
